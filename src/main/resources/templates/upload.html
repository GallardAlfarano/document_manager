<!doctype html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Hinzufügen')}"></head>
<body>
<header th:replace="~{fragments :: nav}"></header>
<main class="narrow"><p class="eyebrow">ARCHIV ERWEITERN</p>
    <h1>Dokumente hinzufügen</h1>
    <p>Bei mehreren Dateien gelten die Angaben für alle ausgewählten Dokumente.</p>
    <form method="post" th:action="@{/upload}" enctype="multipart/form-data" class="panel">
        <label id="dropzone" class="dropzone">Dateien hierher ziehen oder auswählen<input id="files" type="file"
                                                                                          name="files" multiple
                                                                                          required><span id="fileNames">PDF, Bilder, ZIP und andere Originaldateien · maximal 100 MB pro Datei / 500 MB insgesamt</span></label>
        <div class="grid"><label>Datum (optional)<input type="date" name="date"><small>Leer lassen, wenn kein Datum
            bekannt ist.</small></label><label>Absender *<input name="sender" list="senders" maxlength="120" required
                                                                placeholder="z. B. Sparkasse"></label><label>Haupttag
            *<input name="main" list="mains" maxlength="120" required
                    placeholder="Auswählen oder neu anlegen"></label><label>Dokumententyp *<input name="type"
                                                                                                  list="types"
                                                                                                  maxlength="120"
                                                                                                  required
                                                                                                  placeholder="z. B. Rechnung"></label>
        </div>
        <label>Zusätzliche Tags<input id="tagInput" name="tags" list="extras"
                                      placeholder="Relevant für Steuererklärung; Todo"></label>
        <div th:replace="~{fragments :: extras}"></div>
        <p class="hint">Ablage: Haupttag / Absender / Datum_Originaldateiname. Ohne Datum wird kein Datumsprefix
            ergänzt. Die ausgewählte Quelldatei bleibt erhalten.</p>
        <div class="actions">
            <button>Dokumente speichern</button>
            <a href="/">Abbrechen</a></div>
    </form>
    <div th:replace="~{fragments :: suggestions}"></div>
</main>
</body>
</html>
